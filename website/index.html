    <!--
      Zet het opgeslagen thema vóór de eerste schilderbeurt, anders knippert de
      pagina eerst in de systeemkleur. Zonder opgeslagen keuze blijft het
      attribuut weg en beslist de prefers-color-scheme-query in de CSS.
    -->
    <script>
      try {
        var t = localStorage.getItem('stb-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>

        <a href="https://github.com/MisterDuckles/SetupToolbox/releases/latest">github.com/MisterDuckles/SetupToolbox</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
